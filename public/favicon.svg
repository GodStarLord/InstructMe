<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E0A899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0A0A0E"/>
  <circle cx="50" cy="50" r="36" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- Dynamic pulse / stroke wave -->
  <path d="M 24 50 Q 36 28 50 50 T 76 50" stroke="url(#roseGlow)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="6" fill="#F43F5E" filter="url(#glow)"/>
</svg>